<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nhii 🌸</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    background:
        radial-gradient(circle at top,#ff8bd130,transparent 40%),
        linear-gradient(to bottom,#120014,#220028,#32003f,#170016);
    font-family:'Poppins',sans-serif;
    position:relative;
}

/* SAO */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{
        opacity:0.2;
        transform:scale(1);
    }
    to{
        opacity:1;
        transform:scale(1.8);
    }
}

/* BLING */

.sparkle{
    position:absolute;
    color:white;
    font-size:18px;
    animation:spark 2s infinite;
    pointer-events:none;
}

@keyframes spark{
    0%{
        opacity:0;
        transform:scale(0.5) rotate(0deg);
    }
    50%{
        opacity:1;
        transform:scale(1.5) rotate(180deg);
    }
    100%{
        opacity:0;
        transform:scale(0.5) rotate(360deg);
    }
}

/* HOA RƠI */

.falling{
    position:absolute;
    top:-120px;
    opacity:0.85;
    pointer-events:none;
    animation:fall linear infinite;
    filter:
        drop-shadow(0 0 10px rgba(255,255,255,0.5))
        drop-shadow(0 0 20px rgba(255,182,193,0.6));
}

@keyframes fall{
    from{
        transform:translateY(-10vh) rotate(0deg);
    }

    to{
        transform:translateY(120vh) rotate(360deg);
    }
}

/* CENTER */

.center-box{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:10;
    animation:fadeUp 2s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translate(-50%,-40%);
    }
    to{
        opacity:1;
        transform:translate(-50%,-50%);
    }
}

/* TITLE */

h1{
    font-size:82px;
    font-family:'Dancing Script',cursive;
    color:#ffd9ef;

    text-shadow:
        0 0 10px #ffb6d9,
        0 0 30px #ff69b4,
        0 0 60px #ff69b4;
}

/* BÓ HOA */

.bouquet{
    width:360px;
    margin-top:20px;

    animation:float 4s ease-in-out infinite;

    filter:
        drop-shadow(0 0 20px rgba(255,182,193,0.8))
        drop-shadow(0 0 50px rgba(255,105,180,0.7));
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-15px);
    }

    100%{
        transform:translateY(0px);
    }
}

.music{
    position:absolute;
    bottom:20px;
    right:20px;
    color:#ffd6ec;
    font-size:14px;
    opacity:0.9;
}

/* MOBILE */

@media(max-width:768px){

    h1{
        font-size:55px;
    }

    .bouquet{
        width:250px;
    }
}

</style>
</head>

<body>

<!-- NHẠC -->
<audio id="music" loop>
    <source src="./dunglamtraitimanhdau.mp3" type="audio/mp3">
</audio>

<script>

window.onload = () => {

    document.body.addEventListener("click", () => {

        const music = document.getElementById("music");

        music.play();

    }, { once:true });

};

</script>
<audio id="music" loop>

</audio>

<audio id="music" loop>

<script>

window.addEventListener("click", () => {

<div class="center-box">

</div>

<div class="music">
🎵 Đừng Làm Trái Tim Anh Đau — Sơn Tùng M-TP

<script>

/* SAO */

for(let i=0;i<100;i++){

    const star=document.createElement("div");

    star.classList.add("star");

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.animationDuration=

/* BLING */

for(let i=0;i<50;i++){

/* TẠO HOA RƠI */

for(let i=0;i<20;i++){

    const flower=document.createElement("div");

    flower.classList.add("falling");

    flower.style.left=Math.random()*100+"vw";

</body>
</html>
